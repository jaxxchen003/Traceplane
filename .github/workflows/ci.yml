name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traceplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d traceplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traceplane?schema=public
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/traceplane?schema=public
      NEXT_PUBLIC_DEFAULT_LOCALE: zh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schemas
        run: |
          npx prisma validate --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.postgres.prisma

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
